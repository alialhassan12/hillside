services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hillside_backend
    ports:
      - "8000:10000"
    environment:
      - PORT=10000
      - APP_NAME=Hillside
      - APP_ENV=local
      - APP_DEBUG=true
      - APP_URL=http://localhost:8000
      - RUN_MIGRATIONS=false
    env_file:
      - .env
    volumes:
      - ./storage:/var/www/html/storage

